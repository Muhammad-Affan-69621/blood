<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#a61b2b"><link rel="icon" href="icons/blood-drop.svg" type="image/svg+xml"><link rel="stylesheet" href="css/theme.css"><link rel="stylesheet" href="css/layout.css"><link rel="stylesheet" href="css/dialogs.css"><link rel="stylesheet" href="css/organizations.css"><script defer src="js/config.js"></script><script defer src="js/api-client.js"></script><script defer src="js/auth.js"></script><script defer src="js/navigation.js"></script><title>Create organization | Blood App</title><script defer src="js/pages/create-organization.js"></script><script defer src="js/current-year.js"></script></head><body><div class="site-shell"><header class="app-header" id="app-header"></header><main class="app-main"><div class="org-heading"><div><p class="eyebrow">Organization workspace</p><h1>Create an organization</h1><p>Create an organization and become its administrator.</p></div><a class="button button--secondary" href="organizations.html">Back to directory</a></div><div id="page-message" class="status-banner" role="status" hidden></div><section class="org-panel"><form id="create-form" class="org-form"><div class="org-field"><label for="name">Organization name *</label><input id="name" name="name" required minlength="2" maxlength="200" autocomplete="organization" placeholder="e.g. Quetta Blood Donors"></div><div class="org-field"><label for="slug">Organization URL slug *</label><input id="slug" name="slug" required minlength="2" maxlength="120" pattern="[a-z0-9]+(?:-[a-z0-9]+)*" placeholder="quetta-blood-donors"><span class="org-help">Use lowercase letters, numbers, and single hyphens.</span></div><div class="org-actions"><button id="create-button" class="button" type="submit">Create organization</button><a class="button button--secondary" href="organizations.html">Cancel</a></div></form></section></main><footer class="app-footer">© <span data-current-year></span> Blood App. All rights reserved.</footer></div></body></html>

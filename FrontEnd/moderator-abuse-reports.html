<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#a61b2b"><link rel="icon" href="icons/blood-drop.svg" type="image/svg+xml"><link rel="stylesheet" href="css/theme.css"><link rel="stylesheet" href="css/layout.css"><link rel="stylesheet" href="css/organizations.css"><link rel="stylesheet" href="css/admin-dashboard.css"><link rel="stylesheet" href="css/dialogs.css"><script defer src="js/config.js"></script><script defer src="js/api-client.js"></script><script defer src="js/auth.js"></script><script defer src="js/navigation.js"></script><script defer src="js/pages/moderator-abuse-reports.js"></script><script defer src="js/current-year.js"></script><title>Abuse report queue | Blood App</title></head><body><div class="site-shell"><header class="app-header" id="app-header"></header><main class="app-main admin-main"><div class="admin-heading"><div><p class="eyebrow">Moderation workspace</p><h1>Abuse report queue</h1><p>Review reports and record a supported decision.</p></div><div class="org-actions"><a class="button button--secondary" href="moderator-dashboard.html">Moderator dashboard</a><button id="refresh-reports" class="button" type="button">Refresh queue</button></div></div><div id="page-message" class="status-banner" role="status" hidden></div><section class="org-panel"><div class="admin-section-heading"><label for="report-status-filter">Filter by status</label><select id="report-status-filter"><option value="">Open and under review</option><option value="OPEN">Open</option><option value="UNDER_REVIEW">Under review</option><option value="RESOLVED">Resolved</option><option value="DISMISSED">Dismissed</option></select></div><div id="reports-list" class="admin-report-list"><div class="org-empty">Loading reports…</div></div></section></main><footer class="app-footer">© <span data-current-year></span> Blood App. All rights reserved.</footer></div><dialog id="report-modal" class="org-modal"><form id="report-form" class="org-modal-inner"><h2>Review abuse report</h2><p id="report-summary" class="org-muted"></p><p id="report-context"></p><label class="org-field" for="report-decision">Decision<select id="report-decision" required><option value="UNDER_REVIEW">Move to under review</option><option value="RESOLVED">Resolve</option><option value="DISMISSED">Dismiss</option></select></label><label class="org-field" for="report-resolution">Review notes / resolution<textarea id="report-resolution" rows="4" maxlength="1000" placeholder="Required to resolve or dismiss"></textarea></label><div id="report-form-message" class="org-status" role="status" hidden></div><div class="org-modal-actions"><button id="report-cancel" class="button button--secondary" type="button">Cancel</button><button id="report-submit" class="button" type="submit">Save decision</button></div></form></dialog></body></html>

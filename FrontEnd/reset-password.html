<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#a61b2b">
  <meta name="description" content="Blood App secure account access.">
  <title>Reset password | Blood App</title>
  <link rel="icon" href="icons/blood-drop.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/auth.css">
  <script defer src="js/config.js"></script>
  <script defer src="js/api-client.js"></script>
  <script defer src="js/auth.js"></script>
  <script defer src="js/pwa.js"></script>
  <script defer src="js/reset-password.js"></script>
  <script defer src="js/current-year.js"></script>
</head>
<body>
  <div class="auth-shell">
    <header class="site-header">
      <a class="brand" href="login.html" aria-label="Blood App home">
        <img src="icons/blood-drop.svg" alt="">
        <span class="brand-name">Blood App</span>
      </a>
      <a class="header-link" href="login.html">Back to sign in</a>
    </header>
    <main class="auth-main">
      <section class="auth-card" aria-labelledby="page-title">
        <p class="auth-eyebrow">Secure your account</p>
        <h1 class="auth-title" id="page-title">Choose a new password</h1>
        <p class="auth-intro">Use the secure link from your reset email. Reset links can expire or be used only once.</p>
        <form id="reset-form" novalidate>
          <input type="hidden" id="reset-token" name="token">
          <div id="form-message" class="message" role="status" aria-live="polite" hidden></div>
          <div class="form-field">
            <label for="password">New password</label>
            <div class="password-wrap">
              <input id="password" name="newPassword" type="password" autocomplete="new-password" minlength="8" maxlength="72" required aria-describedby="password-error">
              <button class="password-toggle" id="password-toggle" type="button" aria-label="Show password" aria-pressed="false">Show</button>
            </div>
            <p class="field-error" id="password-error"></p>
          </div>
          <div class="form-field">
            <label for="confirm-password">Confirm new password</label>
            <input id="confirm-password" name="confirmPassword" type="password" autocomplete="new-password" minlength="8" maxlength="72" required aria-describedby="confirm-password-error">
            <p class="field-error" id="confirm-password-error"></p>
          </div>
          <button class="button" id="submit-button" type="submit"><span class="button-label">Reset password</span></button>
          <p class="auth-bottom"><a href="forgot-password.html">Request a new reset link</a></p>
        </form>
      </section>
    </main>
    <footer class="auth-footer">© <span data-current-year></span> Blood App. All rights reserved.</footer>
  </div>
</body>
</html>

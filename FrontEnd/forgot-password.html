<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#a61b2b">
  <meta name="description" content="Blood App secure account access.">
  <title>Forgot password | Blood App</title>
  <link rel="icon" href="icons/blood-drop.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/auth.css">
  <script defer src="js/config.js"></script>
  <script defer src="js/api-client.js"></script>
  <script defer src="js/auth.js"></script>
  <script defer src="js/pwa.js"></script>
  <script defer src="js/forgot-password.js"></script>
  <script defer src="js/current-year.js"></script>
</head>
<body>
  <div class="auth-shell">
    <header class="site-header">
      <a class="brand" href="login.html" aria-label="Blood App home">
        <img src="icons/blood-drop.svg" alt="">
        <span class="brand-name">Blood App</span>
      </a>
      <a class="header-link" href="login.html">Back to sign in</a>
    </header>
    <main class="auth-main">
      <section class="auth-card" aria-labelledby="page-title">
        <p class="auth-eyebrow">Account recovery</p>
        <h1 class="auth-title" id="page-title">Reset your password</h1>
        <p class="auth-intro">Enter the email address associated with your account. If an account exists, we'll send reset instructions.</p>
        <form id="forgot-form" novalidate>
          <div id="form-message" class="message" role="status" aria-live="polite" hidden></div>
          <div class="form-field">
            <label for="email">Email address</label>
            <input id="email" name="email" type="email" autocomplete="email" inputmode="email" maxlength="254" required placeholder="you@example.com" aria-describedby="email-error">
            <p class="field-error" id="email-error"></p>
          </div>
          <button class="button" id="submit-button" type="submit"><span class="button-label">Send reset instructions</span></button>
          <p class="auth-bottom"><a href="login.html">Return to sign in</a></p>
        </form>
      </section>
    </main>
    <footer class="auth-footer">© <span data-current-year></span> Blood App. All rights reserved.</footer>
  </div>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#a61b2b"><meta name="description" content="Review notifications about your blood requests.">
  <title>Notifications | Blood App</title><link rel="icon" href="icons/blood-drop.svg" type="image/svg+xml"><link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="css/theme.css"><link rel="stylesheet" href="css/layout.css"><link rel="stylesheet" href="css/notifications.css">
  <script defer src="js/config.js"></script><script defer src="js/api-client.js"></script><script defer src="js/auth.js"></script><script defer src="js/navigation.js"></script><script defer src="js/pwa.js"></script><script defer src="js/pages/recipient-notifications.js"></script><script defer src="js/current-year.js"></script>
</head>
<body><div class="site-shell"><header class="app-header" id="app-header"></header><main class="app-main" id="main-content">
  <div class="notifications-heading"><div><p class="eyebrow">Recipient workspace</p><h1>Notifications</h1><p>Updates about your blood requests and important account activity.</p></div><div class="heading-actions"><button class="button button--secondary" type="button" id="refresh-button">Refresh</button><button class="button" type="button" id="read-all-button">Mark all as read</button></div></div>
  <div id="page-message" class="status-banner" role="status" aria-live="polite" hidden></div>
  <section class="notification-summary" aria-label="Notification summary"><article class="summary-card"><span>Notifications on this page</span><strong id="total-count">—</strong></article><article class="summary-card"><span>Unread notifications</span><strong id="unread-count">—</strong></article></section>
  <div class="results-bar"><p id="results-summary" aria-live="polite">Loading notifications…</p><label for="page-size">Per page <select id="page-size"><option value="10">10</option><option value="20" selected>20</option><option value="50">50</option><option value="100">100</option></select></label></div>
  <section id="notification-list" class="notification-list" aria-label="Notifications" aria-live="polite"><div class="empty-state loading">Loading notifications…</div></section>
  <nav class="pagination" aria-label="Notification pages"><button class="button button--secondary" type="button" id="previous-page" disabled>Previous</button><span id="page-indicator">Page 1</span><button class="button button--secondary" type="button" id="next-page" disabled>Next</button></nav>
</main><footer class="app-footer">© <span data-current-year></span> Blood App. All rights reserved.</footer></div></body></html>
